name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Flutter iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -vr ZAI_X_unsigned.ipa Payload/
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAI_X_unsigned_ipa
          path: ZAI_X_unsigned.ipa
