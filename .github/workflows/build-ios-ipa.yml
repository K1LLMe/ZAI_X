name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build iOS IPA (Ad-hoc)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}
      
      - name: Create IPA using xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            OTHER_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""
          
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y Runner.ipa Payload/
          cd ..
      
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ios/Runner.ipa
          retention-days: 30
      
      - name: Display build info
        run: |
          echo "✅ iOS IPA 编译完成！"
          echo "📦 Build Number: ${{ github.run_number }}"
          echo "📱 IPA 文件已上传到 Artifacts"
