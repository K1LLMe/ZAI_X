name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build Flutter for iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign
      
      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update
      
      - name: Fix Runner project settings
        run: |
          cd ios
          # 设置 Team ID 为空以跳过签名要求
          ruby - <<'RUBY'
          require 'xcodeproj'
          
          project_path = 'Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = ''
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
            end
          end
          
          project.save
          RUBY
      
      - name: Build iOS App Archive
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive
      
      - name: Create IPA manually
        run: |
          cd ios/build
          mkdir -p ipa
          cd Runner.xcarchive
          cp -r Products/Applications/Runner.app ../ipa/
          cd ../ipa
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa ../ipa/
      
      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ios/build/ipa/Runner.ipa
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ios/build/Logs
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Display build info
        if: success()
        run: |
          echo "✅ iOS IPA 编译完成！"
          echo "📦 Build Number: ${{ github.run_number }}"
          echo "📱 IPA 文件已上传到 Artifacts"
